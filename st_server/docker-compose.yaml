services:
  server:
    build: .
    image: gcc-core
    volumes:
      - ./server/:/app
    tty: true
    ports:
      - 8080:8080
    networks:
      net-172.20.0.0:
        ipv4_address: 172.20.0.100
  client:
    build: .
    image: gcc-core
    volumes:
      - ./client:/app
    tty: true
    networks:
      net-172.20.0.0:
        ipv4_address: 172.20.0.101

# define network
networks:
      net-172.20.0.0:
        name: net-172.20.0.0
        ipam:
            config:
                - subnet: 172.20.0.0/24